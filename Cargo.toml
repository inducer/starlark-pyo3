[package]
name = "starlark-pyo3"
version = "0.1.0"
authors = ["Andreas Kloeckner <inform@tiker.net>"]
license = "MIT"

description = "Python bindings for starlark-rust"
homepage = "https://github.com/inducer/starlark-pyo3"
repository = "https://github.com/inducer/starlark-pyo3"
readme = "README.rst"
edition = "2021"

exclude = [
        "dist/*",
        ]

[lib]
crate-type = ["cdylib"]
name = "starlark"

[dependencies]
# NOTE: When updating starlark, check for further reasons why Module may not be
# Send.
starlark = "^0.14.2"
starlark_derive = "^0.14.2"
gazebo = "^0.8.1"
allocative = "^0.3.6"
dupe = "^0.9.1"

anyhow = "^1.0.65"
pyo3 = { version = "0.26", features = ["extension-module"] }

# needed to resolve contradictory constraints in dependencies
syn = "^1.0.96"

serde_json = "1.0"
num-bigint = "0.4.3"
thiserror = "^1.0.35"

proc-macro2 = "^1.0.63"
rust_decimal = "1.33"


[lints.clippy]
all = "warn"
